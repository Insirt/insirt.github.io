<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Work Test</title>
</head>

<body style="font-family: sans-serif; max-width: 600px; margin: 50px auto; padding: 20px;">

  <h1>Work Test</h1>

  <p>
    If you can type into the fields below, normal HTML input is permitted
    on this domain.
  </p>

  <h3>Text input</h3>
  <input
    type="text"
    placeholder="Try typing here"
    style="font-size: 18px; padding: 10px; width: 90%;"
  >

  <h3>Textarea</h3>
  <textarea
    placeholder="Try typing several words here"
    style="font-size: 18px; padding: 10px; width: 90%; height: 100px;"
  ></textarea>

  <h3>Button test</h3>
  <button
    onclick="document.getElementById('result').innerText='Button works!'"
    style="font-size: 18px; padding: 10px;"
  >
    Click Me
  </button>

  <p id="result"></p>

</body>
</html>
