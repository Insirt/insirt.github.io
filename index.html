<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Work Test</title>
</head>

<body style="font-family: sans-serif; max-width: 600px; margin: 50px auto; padding: 20px;">

  <h1>Work Test</h1>

  <p>
    If you can type into the fields below, normal HTML input is permitted
    on this domain.
  </p>

  <h3>Text input</h3>
  <input
    type="text"
    placeholder="Try typing here"
    style="font-size: 18px; padding: 10px; width: 90%;"
  >

  <h3>Textarea</h3>
  <textarea
    placeholder="Try typing several words here"
    style="font-size: 18px; padding: 10px; width: 90%; height: 100px;"
  ></textarea>

  <h3>Button test</h3>
  <button
    onclick="document.getElementById('result').innerText='Button works!'"
    style="font-size: 18px; padding: 10px;"
  >
    Click Me
  </button>

  <p id="result"></p>
<hr>

<h2>Vikunja Connectivity Test</h2>

<button onclick="testVikunja()">
  Test Vikunja Connection
</button>

<pre id="vikunja-result">Not tested yet.</pre>

<script>
async function testVikunja() {
  const output = document.getElementById("vikunja-result");

  output.textContent = "Testing...";

  try {
    const response = await fetch(
      "https://vikunja.gigdrasil.com/api/v1/info"
    );

    output.textContent =
      "SUCCESS\n" +
      "HTTP status: " + response.status + "\n\n" +
      await response.text();

  } catch (error) {
    output.textContent =
      "FAILED\n\n" + error.toString();
  }
}
</script>
</body>
</html>
